name: Databáza kariet

# docs/data/cards.json → /api/cards ho číta z GitHub Pages (rýchlo) namiesto zostavovania naživo (~10 s)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/lib/cards-build.ts"
      - "web/lib/cardmarket.ts"
      - "web/lib/promo-images.ts"
      - "web/scripts/build-cards.ts"
      - ".github/workflows/cards.yml"
  schedule:
    - cron: "41 3 * * *"   # denne

permissions:
  contents: write

concurrency:
  group: fetch            # rovnaká skupina ako Fetch cien – nebijú sa o push
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Odložiť včerajšiu databázu (na report zbierky)
        run: cp ../docs/data/cards.json /tmp/cards-old.json || true
      - run: npm run build:cards
      - name: Report zbierky na Discord
        if: ${{ github.event_name != 'push' }}
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_USERS: hobo
        run: python3 ../tools/collection_report.py --old /tmp/cards-old.json --new ../docs/data/cards.json
      - name: História cien a naplnenie databázy
        if: ${{ github.event_name != 'push' }}
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 ../tools/price_history.py --cards ../docs/data/cards.json --sealed ../docs/data/sealed.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../docs/data/cards.json ../docs/data/card-alts.json ../docs/data/sealed.json
          git diff --cached --quiet && exit 0
          git commit -m "databáza kariet $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && exit 0; sleep 5; done
          exit 1
