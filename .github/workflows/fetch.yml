name: Fetch cien

on:
  schedule:
    - cron: "23 */2 * * *"     # každé 2 hodiny (UTC)
  workflow_dispatch:            # tlačidlo "Run workflow" (Fetch zo stránky)

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stiahnuť ceny, poslať upozornenia, vytvoriť stránku
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python onepiece_ceny.py --once --no-browser
      - name: Uložiť dáta a stránku
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "ceny $(date -u +'%Y-%m-%d %H:%M')"
          # medzitým mohol nahrať dáta PC – zlúč a skús znova
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
