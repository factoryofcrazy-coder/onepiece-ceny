name: Discover
on:
  push:
    branches: [pokemon-discover]
    paths: [tcg_pokemon.py, onepiece_ceny.py]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: rm -rf data/pokemon docs/pokemon docs/data/pokemon.json; python onepiece_ceny.py --game pokemon --once --no-browser --no-notify 2>&1 | tee tools/pokemon_run.log
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/pokemon_run.log data/pokemon docs; git commit -m "test pokémon fetch"; git push
