name: Discover
on:
  push:
    branches: [pokemon-discover]
    paths: [tools/test_pk.mjs, web/app/api/pkcards/route.ts]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npx -y esbuild@0.28.2 web/app/api/pkcards/route.ts --bundle --format=esm --platform=node --outfile=tools/pk_route.mjs && node tools/test_pk.mjs > tools/test_pk.json 2>&1; true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/test_pk.json; git commit -m "test pkcards"; git push
