name: Discover
on:
  push:
    branches: [pokemon-discover]
    paths: [tools/candidates.txt]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python tools/discover.py tools/candidates.txt > tools/disc.jsonl
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/disc.jsonl; git commit -m "prieskum"; git push
