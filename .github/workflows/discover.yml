name: Discover
on:
  push:
    branches: [pokemon-discover]
    paths: [tools/probe.txt]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python tools/probe.py tools/probe.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe; git commit -m "prieskum"; git push
